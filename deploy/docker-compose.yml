# SmartPipe 两容器部署：同一个镜像，两个运行角色，共用一个 /data 卷。
#
#   app     admin-api + bot + bridge   （控制台、蓝信、GitHub Webhook）
#   worker  scheduler + Codex + 构建工具链，另带 patch-verifier（只用于发版构建）
#
# 数据库沿用已有的 postgres 容器（默认 172.17.0.1:5432），不在这里管理。
#
# 首次部署：
#   cp deploy/.env.example deploy/.env
#   chmod 600 deploy/.env
#   sudo ./scripts/install.sh --mode docker
#
# 日常更新：
#   sudo ./scripts/deploy.sh
name: smartpipe

x-runtime: &runtime
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      VERSION: ${SMARTPIPE_VERSION:-dev}
      COMMIT: ${SMARTPIPE_COMMIT:-unknown}
      BUILD_TIME: unknown
  image: smartpipe:local
  restart: unless-stopped
  env_file:
    - .env
  init: true
  # 两个容器用同一 uid 写同一个数据卷，commit/push 不需要任何路径映射。
  user: "10001:10001"
  dns:
    - ${SMARTPIPE_DNS_PRIMARY:-192.168.1.1}
    - ${SMARTPIPE_DNS_SECONDARY:-223.5.5.5}
  # 本机 DNS 会把 github.com 解析到当前网络无法到达的边缘节点；映射到可用的
  # GitHub 边缘地址。其他部署可用 SMARTPIPE_GITHUB_IP 覆盖。
  extra_hosts:
    - "github.com:${SMARTPIPE_GITHUB_IP:-140.82.112.3}"
    - "host.docker.internal:host-gateway"
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"
  volumes:
    - ./data:/data

services:
  app:
    <<: *runtime
    command: ["supervise", "admin-api", "bot", "bridge"]
    environment:
      SMARTPIPE_ADMIN_ADDR: ":8092"
      SMARTPIPE_WEB_DIST: /app/web
      # 服务端读取 Codex 配置的位置（与 worker 共用同一个 codex-home）。
      SMARTPIPE_CODEX_CONFIG: /data/codex-home/config.toml
      # 仓库 clone 根目录；项目创建时选择这里克隆出来的本地库。
      SMARTPIPE_CLONE_ROOT: /data/repos
      # 三个进程在同一个容器内，互相走回环地址。
      SMARTPIPE_ADMIN_URL: http://127.0.0.1:8092
      SMARTPIPE_BOT_ADDR: http://127.0.0.1:8093
      SMARTPIPE_BRIDGE_ADDR: ":8090"
      BOT_HTTP_ADDR: ":8093"
      BRIDGE_URL: http://127.0.0.1:8090
      CRASH_INGEST_URL: http://127.0.0.1:8090/ingest/crash
      SMARTPIPE_SCHEDULER_URL: http://worker:8098
      SMARTPIPE_SCHEDULER_TOKEN: ${SCHEDULER_TOKEN}
      SCHEDULER_URL: http://worker:8098
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN}
      # 手动验证与发版构建仍由 worker 里的 patch-verifier 承担；
      # Issue 修复链路不再调用它。
      SMARTPIPE_VERIFY_URL: http://worker:8095
      SMARTPIPE_RELEASE_URL: http://worker:8095
    ports:
      - "${SMARTPIPE_BIND_ADDR:-0.0.0.0}:${SMARTPIPE_BRIDGE_PORT:-8090}:8090"
      - "${SMARTPIPE_BIND_ADDR:-0.0.0.0}:${SMARTPIPE_ADMIN_PORT:-8092}:8092"
      - "${SMARTPIPE_BIND_ADDR:-0.0.0.0}:${SMARTPIPE_BOT_PORT:-8093}:8093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8092/healthz"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    <<: *runtime
    command: ["supervise", "scheduler", "patch-verifier"]
    environment:
      SCHEDULER_HTTP_ADDR: ":8098"
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN}
      SCHEDULER_WORKSPACE_ROOT: /data/workspaces
      SCHEDULER_REPO_CACHE: /data/scheduler-repos
      SCHEDULER_OUTPUT_DIR: /data/scheduler-outputs
      SMARTPIPE_ADMIN_URL: http://app:8092
      BOT_ADDR: http://app:8093
      INTERNAL_TOKEN: ${SMARTPIPE_BOT_INTERNAL_TOKEN}
      CODEX_PATH: /usr/local/bin/codex
      SMARTPIPE_CODEX_HOME: /data/codex-home
      HOME: /data/codex-home
      # patch-verifier 在 worker 里只承担发版构建和手动验证。
      SMARTPIPE_VERIFY_ADDR: ":8095"
      SMARTPIPE_VERIFY_WORK_ROOT: /data/verify/work
      SMARTPIPE_WORKSPACE_ROOT: /data/verify/workspaces
      SMARTPIPE_RELEASE_WORK_ROOT: /data/verify/releases
      SMARTPIPE_RELEASE_OUTPUT_ROOT: /data/releases
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8098/healthz"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
