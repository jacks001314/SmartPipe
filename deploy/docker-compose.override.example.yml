# 环境专属网络配置示例。通用 compose 不内置 DNS 或任何环境地址。
# 复制为 deploy/docker-compose.override.yml 后按当前环境填写：
#   cp deploy/docker-compose.override.example.yml deploy/docker-compose.override.yml
# 然后在 deploy/.env 设置 SMARTPIPE_DNS_PRIMARY / SMARTPIPE_DNS_SECONDARY。
# 可选：如果当前环境必须固定 github.com 解析，在 app/worker 下增加：
#   extra_hosts:
#     - "github.com:${SMARTPIPE_GITHUB_IP:?set SMARTPIPE_GITHUB_IP in deploy/.env}"
services:
  app:
    dns:
      - ${SMARTPIPE_DNS_PRIMARY:?set SMARTPIPE_DNS_PRIMARY in deploy/.env}
      - ${SMARTPIPE_DNS_SECONDARY:?set SMARTPIPE_DNS_SECONDARY in deploy/.env}
  worker:
    dns:
      - ${SMARTPIPE_DNS_PRIMARY:?set SMARTPIPE_DNS_PRIMARY in deploy/.env}
      - ${SMARTPIPE_DNS_SECONDARY:?set SMARTPIPE_DNS_SECONDARY in deploy/.env}
