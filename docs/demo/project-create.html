<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>新增项目 · 设计预览</title>
<style>
  :root{
    --brand:#2563eb; --brand-weak:#eff5ff; --bg:#eef1f6; --card:#fff;
    --line:#e4e8f0; --text:#1f2937; --muted:#6b7280; --ok:#0f9d58; --warn:#b45309;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:flex-start; justify-content:center; padding:40px 20px;
  }
  .backdrop{position:fixed; inset:0; background:rgba(15,23,42,.38); backdrop-filter:blur(1px)}
  .modal{
    position:relative; width:780px; background:var(--card); border-radius:16px;
    box-shadow:0 24px 70px rgba(15,23,42,.28); overflow:hidden;
  }
  .head{display:flex; justify-content:space-between; align-items:flex-start; padding:22px 24px 14px}
  .title{font-size:18px; font-weight:700}
  .sub{color:var(--muted); font-size:12.5px; margin-top:4px}
  .x{border:0; background:transparent; font-size:18px; color:var(--muted); cursor:pointer}
  .body{padding:4px 24px 18px; display:flex; flex-direction:column; gap:18px}

  .label{font-size:12.5px; font-weight:650; color:#374151; margin-bottom:6px; display:flex; align-items:center; gap:6px}
  .label .req{color:#dc2626}
  .hint{font-size:11.5px; color:var(--muted)}

  .search{width:100%; padding:8px 11px; border:1px solid var(--line); border-radius:9px; font-size:12.5px; outline:none}
  .search:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-weak)}
  .repo-list{margin-top:8px; max-height:206px; overflow:auto; display:flex; flex-direction:column; gap:8px; padding-right:2px}
  .repo{
    display:flex; gap:12px; align-items:flex-start; padding:11px 13px; border:1px solid var(--line);
    border-radius:11px; cursor:pointer; background:#fcfdff; transition:border-color .15s, background .15s;
  }
  .repo:hover{border-color:#bfd6fb}
  .repo.active{border-color:var(--brand); background:var(--brand-weak); box-shadow:0 0 0 3px rgba(37,99,235,.08)}
  .radio{width:16px; height:16px; border-radius:50%; border:2px solid #cbd5e1; margin-top:2px; flex:none; position:relative}
  .repo.active .radio{border-color:var(--brand)}
  .repo.active .radio::after{content:""; position:absolute; inset:2px; border-radius:50%; background:var(--brand)}
  .repo-main{flex:1; min-width:0}
  .repo-name{font-weight:650; font-size:13.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .repo-meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:5px; align-items:center}
  .chip{font-size:11px; padding:1px 7px; border-radius:999px; background:#f1f5f9; color:#475569; border:1px solid #e2e8f0}
  .chip.ok{background:#ecfdf3; border-color:#c7f0d8; color:#0f7a44}
  .chip.warn{background:#fff7ed; border-color:#fed7aa; color:#b45309}
  .chip.pub{background:#f8fafc}
  .repo-path{font-size:11px; color:var(--muted); margin-top:5px; font-family:ui-monospace,Menlo,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .repo-side{font-size:11px; color:var(--muted); white-space:nowrap; margin-top:2px}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  input.text, select, textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:9px; font-size:13px;
    background:#fff; color:var(--text); outline:none;
  }
  input.text:focus, select:focus, textarea:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-weak)}
  textarea{resize:vertical; min-height:62px}
  select:disabled{background:#f8fafc; color:#94a3b8}

  .inline{display:flex; gap:8px; align-items:center}
  .inline .grow{flex:1}

  details.adv{border:1px dashed var(--line); border-radius:11px; padding:10px 13px; background:#fafbfe}
  details.adv summary{cursor:pointer; font-size:12.5px; font-weight:650; color:#475569; list-style:none}
  details.adv summary::-webkit-details-marker{display:none}
  details.adv summary::before{content:"▸ "; color:var(--muted)}
  details.adv[open] summary::before{content:"▾ "}
  .adv-body{margin-top:12px; display:grid; grid-template-columns:1fr 1fr; gap:14px}

  .foot{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 24px 18px; border-top:1px solid var(--line); background:#fcfdff}
  .foot .hint{max-width:430px}
  .btns{display:flex; gap:8px}
  button.btn{padding:8px 16px; border-radius:9px; border:1px solid var(--line); background:#fff; font-size:13px; cursor:pointer}
  button.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600}
  button.btn:disabled{opacity:.5; cursor:not-allowed}

  .summary{font-size:12px; color:#475569; background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:9px 12px; display:none}
  .summary.show{display:block}
  .summary b{color:#111827}
  .json{margin:0 24px 18px; background:#0f172a; color:#cbd5e1; border-radius:10px; padding:12px 14px; font:12px/1.5 ui-monospace,Menlo,monospace; white-space:pre-wrap; display:none}
  .json.show{display:block}
  .toast{position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-12px); background:#0f172a; color:#fff; padding:8px 16px; border-radius:9px; font-size:12.5px; opacity:0; transition:.2s; pointer-events:none}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="modal">
  <div class="head">
    <div>
      <div class="title">新增项目</div>
      <div class="sub">选一个已克隆的仓库，再绑定蓝信群和模型就能创建。</div>
    </div>
    <button class="x" aria-label="关闭">✕</button>
  </div>

  <div class="body">
    <div>
      <div class="label">代码仓库 <span class="req">*</span><span class="hint">只列出已 clone 到本地的仓库</span></div>
      <input class="search" id="repoSearch" placeholder="搜索仓库名或路径，例如 syntropy" />
      <div class="repo-list" id="repoList"></div>
    </div>

    <div class="grid2">
      <div>
        <div class="label">项目名称 <span class="req">*</span></div>
        <input class="text" id="projectName" placeholder="选择仓库后自动填写" />
      </div>
      <div>
        <div class="label">蓝信群 <span class="hint">按群名选择，已被占用的群会置灰</span></div>
        <select id="groupSelect">
          <option value="">暂不绑定（可稍后配置）</option>
          <optgroup label="蓝信机器人 · legacy">
            <option value="g1" disabled>stropy（3 人）— 已被项目 SmartPipe 绑定</option>
            <option value="g2">沙剑锋、mbot、stropy（1 人）</option>
          </optgroup>
        </select>
      </div>
    </div>

    <div class="grid2">
      <div>
        <div class="label">模型</div>
        <select id="modelSelect">
          <option value="">跟随系统默认</option>
          <option value="deepseek">deepseek · 推理 high</option>
          <option value="qax">qax · 推理 high</option>
        </select>
        <div class="hint" style="margin-top:6px">项目里只保留一个模型入口，不再分别选供应商、模型名和推理强度。</div>
      </div>
      <div>
        <div class="label">描述 <span class="hint">可选</span></div>
        <textarea id="desc" placeholder="一句话说明这个项目做什么"></textarea>
      </div>
    </div>

    <div class="summary" id="summary"></div>

    <details class="adv">
      <summary>高级设置</summary>
      <div class="adv-body">
        <div>
          <div class="label">验证契约路径</div>
          <input class="text" value="smartpipe.yaml" />
        </div>
        <div>
          <div class="label">审批要求</div>
          <select>
            <option>维护者批准即可</option>
            <option>需要 CODEOWNERS 审批</option>
            <option>无需审批</option>
          </select>
        </div>
      </div>
    </details>
  </div>

  <div class="foot">
    <div class="hint">仓库路径、分支和 Issue 仓库都从本地克隆自动带出；保存会写入审计日志。</div>
    <div class="btns">
      <button class="btn" id="previewJson">预览提交数据</button>
      <button class="btn" id="cancelBtn">取消</button>
      <button class="btn primary" id="saveBtn">创建项目</button>
    </div>
  </div>
</div>
<pre class="json" id="jsonBox"></pre>
<div class="toast" id="toast">演示：这里会调用创建项目接口</div>

<script>
const repos = [
  { id:"Ch3nYe/syntropy-update-cli", owner:"Ch3nYe", name:"syntropy-update-cli", private:true, fork:false, lang:"Go", branch:"main",
    path:"/data/repos/Ch3nYe/syntropy-update-cli", cloned:"2026/11/8 20:48", size:"已克隆" },
  { id:"jacks001314/SmartPipe", owner:"jacks001314", name:"SmartPipe", private:false, fork:false, lang:"Go", branch:"main",
    path:"/data/repos/jacks001314/SmartPipe", cloned:"2026/11/8 21:06", size:"已克隆" },
  { id:"jacks001314/codex_core", owner:"jacks001314", name:"codex_core", private:false, fork:true, lang:"Go", branch:"main",
    path:"/data/repos/jacks001314/codex_core", cloned:"2026/11/7 10:20", size:"已克隆" }
];

const state = { repo:null, nameTouched:false };

const list = document.getElementById("repoList");
const search = document.getElementById("repoSearch");
const nameInput = document.getElementById("projectName");
const summary = document.getElementById("summary");
const jsonBox = document.getElementById("jsonBox");
const toast = document.getElementById("toast");

function render(){
  const q = search.value.trim().toLowerCase();
  const items = repos.filter(r => !q || r.id.toLowerCase().includes(q) || r.path.toLowerCase().includes(q));
  list.innerHTML = items.map(r => `
    <div class="repo ${state.repo===r.id?'active':''}" data-id="${r.id}">
      <div class="radio"></div>
      <div class="repo-main">
        <div class="repo-name">${r.id}</div>
        <div class="repo-meta">
          <span class="chip ${r.private?'warn':'pub'}">${r.private?'私有':'公开'}</span>
          ${r.fork?'<span class="chip">Fork</span>':''}
          <span class="chip">${r.lang}</span>
          <span class="chip">分支 ${r.branch}</span>
          <span class="chip ok">已克隆</span>
        </div>
        <div class="repo-path">${r.path}</div>
      </div>
      <div class="repo-side">${r.cloned}</div>
    </div>`).join("") || '<div class="hint" style="padding:14px">没有匹配的仓库，先去 GitHub 配置页 Clone。</div>';
  list.querySelectorAll(".repo").forEach(el => el.addEventListener("click", () => selectRepo(el.dataset.id)));
}

function selectRepo(id){
  state.repo = id;
  const repo = repos.find(r => r.id===id);
  if(!state.nameTouched || nameInput.value.trim()===""){
    nameInput.value = repo.name;
  }
  renderSummary();
  render();
}

function renderSummary(){
  const repo = repos.find(r => r.id===state.repo);
  if(!repo){ summary.classList.remove("show"); return; }
  const group = document.getElementById("groupSelect").selectedOptions[0];
  const model = document.getElementById("modelSelect").selectedOptions[0];
  summary.classList.add("show");
  summary.innerHTML = `将创建项目 <b>${nameInput.value || repo.name}</b>：仓库 <b>${repo.id}</b>（${repo.branch}），
    蓝信群 <b>${group && group.value ? group.textContent : "未绑定"}</b>，模型 <b>${model && model.value ? model.textContent : "系统默认"}</b>。`;
}

function payload(){
  const repo = repos.find(r => r.id===state.repo);
  const group = document.getElementById("groupSelect").value;
  return {
    name: nameInput.value.trim() || repo?.name || "",
    local_repo_path: repo?.path || "",
    github_repo_url: repo ? "https://github.com/"+repo.id : "",
    github_default_branch: repo?.branch || "",
    github_issue_repo: repo?.id || "",
    bluex_group_ids: group==="g2" ? "2285568-A9hXwfDkkLomCYmw738czzqOco02L5" : "",
    codex_model_profile: document.getElementById("modelSelect").value,
    description: document.getElementById("desc").value
  };
}

nameInput.addEventListener("input", () => { state.nameTouched = nameInput.value.trim()!==""; renderSummary(); });
document.getElementById("groupSelect").addEventListener("change", renderSummary);
document.getElementById("modelSelect").addEventListener("change", renderSummary);
search.addEventListener("input", render);

document.getElementById("previewJson").addEventListener("click", () => {
  jsonBox.textContent = JSON.stringify(payload(), null, 2);
  jsonBox.classList.toggle("show");
});
document.getElementById("saveBtn").addEventListener("click", () => {
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"), 1800);
});
document.getElementById("cancelBtn").addEventListener("click", () => {
  state.repo=null; state.nameTouched=false; nameInput.value=""; search.value="";
  document.getElementById("groupSelect").value=""; document.getElementById("modelSelect").value="";
  document.getElementById("desc").value=""; summary.classList.remove("show"); jsonBox.classList.remove("show");
  render();
});

render();
</script>
</body>
</html>
